<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="我的个人游戏档案馆：记录玩过的游戏、截图、评分和通关回忆。" />
  <title>My Game Archive</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <header class="site-header">
    <div>
      <p class="eyebrow">PERSONAL GAME ARCHIVE</p>
      <h1>我的游戏档案馆</h1>
      <p class="subtitle">Games I played, worlds I visited.</p>
    </div>
    <div class="summary">
      <strong>1</strong>
      <span>Games Archived</span>
    </div>
  </header>

  <main>
    <section class="year-section">
      <div class="section-title">
        <h2>2026</h2>
        <span>01 GAME</span>
      </div>

      <div class="game-grid">
        <a class="game-card" href="games/pragmata.html">
          <div class="cover-wrap">
            <img src="assets/covers/pragmata-placeholder.svg" alt="《识质存在》封面占位图" />
            <span class="status">已通关</span>
          </div>
          <div class="card-body">
            <div class="card-topline">
              <span>NINTENDO SWITCH 2</span>
              <span>8 / 10</span>
            </div>
            <h3>识质存在</h3>
            <p class="english-title">PRAGMATA</p>
            <p class="memory">
              从射击解谜时的手忙脚乱，到后来操作逐渐变得丝滑；也正是它，
              让我重新产生了在宿舍配一台游戏 PC 的想法。
            </p>
            <div class="tags">
              <span>#2026</span><span>#科幻</span><span>#动作</span><span>#已通关</span>
            </div>
          </div>
        </a>
      </div>
    </section>
  </main>

  <footer>
    <span>MY GAME ARCHIVE</span>
    <span>Built for memories, not rankings.</span>
  </footer>
</body>
</html>
