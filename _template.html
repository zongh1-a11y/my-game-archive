<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>游戏名｜My Game Archive</title>
  <link rel="stylesheet" href="../assets/style.css" />
</head>
<body>
  <header class="detail-nav">
    <a href="../index.html">← 返回档案馆</a>
    <span>GAME XXX · YEAR</span>
  </header>

  <main class="detail-page">
    <section class="hero">
      <div class="hero-cover">
        <img src="../assets/covers/your-cover.jpg" alt="游戏封面" />
      </div>
      <div class="hero-info">
        <p class="eyebrow">GAME XXX · COMPLETED</p>
        <h1>游戏中文名</h1>
        <p class="hero-en">GAME ENGLISH TITLE</p>

        <div class="meta-grid">
          <div><span>平台</span><strong>平台</strong></div>
          <div><span>开始</span><strong>YYYY.MM.DD</strong></div>
          <div><span>通关</span><strong>YYYY.MM.DD</strong></div>
          <div><span>时长</span><strong>约 XX 小时</strong></div>
        </div>

        <div class="score-block">
          <div class="score-number">X<span>/10</span></div>
          <p>一句完成情况</p>
        </div>
      </div>
    </section>

    <section class="quote-card">
      <p>“一句话记忆。”</p>
    </section>

    <section class="content-section prose">
      <h2>通关回忆</h2>
      <h3>第一部分</h3>
      <p>写你真正想记住的内容。</p>
      <h3>第二部分</h3>
      <p>继续写。</p>
    </section>

    <section class="content-section">
      <h2>截图墙</h2>
      <div class="gallery">
        <img src="../assets/screenshots/your-game/01.jpg" alt="截图 1" />
        <img src="../assets/screenshots/your-game/02.jpg" alt="截图 2" />
      </div>
    </section>
  </main>

  <footer>
    <span>MY GAME ARCHIVE</span>
    <a href="../index.html">返回首页</a>
  </footer>
</body>
</html>
